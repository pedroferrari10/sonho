<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Cadastro de Aluno</title>
    <link rel="icon" type="image" href="img/ap.jpg">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <header>
        <h1>Cadastro de Aluno e Responsável</h1>
		<hr>
    </header>
    <main>
        <form>
            <label for="nome_aluno">Nome do aluno:</label>
            <input type="text" id="nome_aluno" name="nome_aluno" required pattern="^[A-Za-zÀ-ÿ\s]+$" placeholder="Digite o nome do aluno" title="Digite o nome completo do aluno (apenas letras)">
            <br><br>

            <label for="idade_aluno">Idade do aluno:</label>
            <input type="number" id="idade_aluno" name="idade_aluno" required min="5" max="100" placeholder="5 - 100" title="Coloque a idade do aluno (mínimo 5 anos)">
            <br><br>
            <label for="nome_responsavel">Nome do responsável:</label>
            <input type="text" id="nome_responsavel" name="nome_responsavel" required pattern="^[A-Za-zÀ-ÿ\s]+$" placeholder="Digite o nome do responsável" title="Digite o nome completo do responsável">
            <br><br>
                <legend>Gênero do aluno:</legend>
                <input type="radio" id="masc" name="genero" value="masculino" required>
                <label for="masc">Masculino</label><br>
                <input type="radio" id="fem" name="genero" value="feminino">
                <label for="fem">Feminino</label><br>
                <input type="radio" id="outro" name="genero" value="outro">
                <label for="outro">Outro</label>
            <br>
            <label for="telefone_responsavel">Telefone do responsável:</label>
            <input type="text" id="telefone_responsavel" name="telefone_responsavel" required pattern="^[0-9]{10,11}$" placeholder="11223344556" title="Digite o DDD + telefone (apenas números, 10 ou 11 dígitos)">
            <br><br>
            <button type="submit">Cadastrar</button>
            <button type="reset">Limpar</button>
        </form>
    </main>
	<hr>
	<h5>Pedro Augusto Ferrari Nalão &copy-Todos os direitos reservados<br>Trabalho acadêmico sem fins lucrativos</h5>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<title>FORMULARIO DE PRODUTOS</title>
		<meta charset="utf-8">
		<link rel="icon" type="image" href="img/p.jpg">
		<link rel="stylesheet" type="text/css" href="style.css">
	</head>
	<body>
		<h1>FORMULARIO DE PRODUTOS</h1>
		<hr>
		<h3>
			<main>
				<form>
					<label for="nome_produto">Nome do produto:</label>
					<input type="text" id="nome_produto" name="nome_produto" required pattern="^[A-Za-zÀ-ÿ]+$" placeholder="Digite o nome do produto" title="Digite o nome do produto">
					<br><br>
					<label for="id_produto">ID do produto:</label>
					<input type="text" id="id_produto" name="id_produto" required pattern="^[0-9]{11}$" placeholder="11223344556" title="Digite apenas números (de 11 digitos)">
					<br><br>
						<legend>tipo do produto:</legend>
						<input type="radio" id="fresco" name="tipo" value="fresco" required>
						<label for="masc">fresco</label><br>
						<input type="radio" id="conserva" name="tipo" value="conserva">
						<label for="fem">conserva</label><br>
						<input type="radio" id="ultra-processado" name="tipo" value="utra-processado">
						<label for="fem">ultra-processado</label><br>
						<input type="radio" id="outros" name="tipo" value="outros">
						<label for="fem">outros</label><br>
						<label for="nome_empresa">Nome da empresa:</label>
						<input type="text" id="nome_empresa" name="nome_empresa" required pattern="^[A-Za-zÀ-ÿ\s]+$" placeholder="Digite o nome da empresa" title="Digite apenas letras">
						<br><br>
					<button type="submit">Cadastrar</button>
					<button type="reset">Limpar</button>
				</form>
			</main>
		</h3>
		<hr>
		<h5>Pedro Augusto Ferrari NAlão &copy-Todos os direitos reservados<br>Trabalho acadêmico sem fins lucrativos</h5>
	</body>
</html>

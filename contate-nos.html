	<body>
		<h1>DÊ A SUA AVALIAÇÃO</h1>
		<h3>
			<nav>
			  <ul>
				<li><a href="file:/pedroferrari10.github.io/sonho/index.html">Home</a></li>
				<li><a href="file:/pedroferrari10.github.io/sonho/futuro.html">futuro</a></li>
				<li><a href="file:/pedroferrari10.github.io/sonho/contate-nos.html">avalie-nos</a></li>
			  </ul>
			</nav>
			<div class="container_control">
				<div class="container">
					<main>
						<form>
							<label for="nome">Nome:</label>
							<input type="text" id="nome" name="nome" required pattern="^[A-Za-zÀ-ÿ\s]+$" placeholder="Digite o seu nome" title="Digite apenas letras">
							<br><br>
							<label for="email">Email:</label>
							<input type="text" id="email" name="email" required pattern="^[A-Za-zÀ-ÿ0-9\s]+${9}" placeholder="gordinho_palmerense@gmail.com" title="digite o seu email">
							<br><br>
							<label for="avaliacao">avaliação:</label>
							<input type="number" id="avaliacao" name="avaliacao" required min="0" max="5" placeholder="5" title="coloque a sua avaliação">
							<br><br>
							<label for="comentario">Comentário:</label><br>
							<textarea id="comentario" cols="40" rows="10" placeholder="Digite aqui o seu comentário sobre a página:"></textarea>
							<br><br>
							<button type="submit">Cadastrar</button>
							<button type="reset">Limpar</button>
						</form>
					</main>
				</div>
			</div>
		</h3>
